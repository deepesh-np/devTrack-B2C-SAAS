version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: devtrack-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack123
      POSTGRES_DB: devtrack

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: